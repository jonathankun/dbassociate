resources:
  jobs:
    no_prod_daily_transacciones_retail:
      name: daily_transacciones_retail
      description: El WORKFLOW EJECUTA DE MANERA DIARIA
      tasks:
        - task_key: bronze_load
          notebook_task:
            notebook_path: ../src/daily_transacciones_retail/s9_bronze
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
        - task_key: silver_transform
          depends_on:
            - task_key: bronze_load
          notebook_task:
            notebook_path: ../src/daily_transacciones_retail/s9_silver
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
        - task_key: gold_aggregated
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: ../src/daily_transacciones_retail/s9_gold
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
      git_source:
        git_url: https://github.com/jonathankun/dbassociate.git
        git_provider: gitHub
        git_branch: main
      tags:
        criticidad: alta
        squad: underworld
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED