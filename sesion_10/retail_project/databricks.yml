# This is a Databricks asset bundle definition for retail_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: retail_project
  uuid: 077f7e7e-9261-4a5f-9ba1-680bd6bc2072

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  bronze_schema:
    description: Esquema de bronce
  silver_schema:
    description: Esquema de silver
  gold_schema:
    description: Esquema gold

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405617138371952.12.azuredatabricks.net
    variables:
      catalog: dbassociate
      schema: ${workspace.current_user.short_name}
      bronze_schema: bronze_dev
      silver_schema: silver_dev
      gold_schema: gold_dev
      
  prod:
    mode: production
    workspace:
      host: https://adb-7405617138371952.12.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/diana.luz.rr.2000@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/diana.luz.rr.2000@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbassociate
      schema: prod
      bronze_schema: bronze_prod
      silver_schema: silver_prod
      gold_schema: gold_prod
    permissions:
      - user_name: diana.luz.rr.2000@outlook.com
        level: CAN_MANAGE
